site_name: SimClass - 國小數學微型教學 AI 學生模擬系統
site_description: 師資培育微型教學之多代理人 AI 學生模擬系統開發文檔與每週進度報告
site_author: Ho-yu-chiao
site_url: https://ho-yu-chiao.github.io/senior-project/
repo_url: https://github.com/Ho-yu-chiao/senior-project
repo_name: Ho-yu-chiao/senior-project

theme:
  name: material
  language: zh-Hant
  palette:
    # 淺色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    # 深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首頁: index.md
  - SimClass 核心設計:
      - 系統總覽: simclass/overview.md
      - 教學教案與 15 分鐘腳本: simclass/pedagogy.md
      - 5 位 AI 學生規格 (Agent Cards): simclass/agents.md
      - 課堂事件與轉移規則: simclass/events.md
      - Orchestrator 調度機制: simclass/orchestrator.md
  - 專案工程規劃:
      - 需求與目標: spec/requirements.md
      - 系統架構: spec/architecture.md
      - 時程規劃 (Roadmap): spec/roadmap.md
  - 進度回報:
      - 第 01 週進度: progress/week01.md
  - 會議記錄:
      - 會議記錄模板: meetings/template.md
      - 第一次討論記錄: meetings/meeting-01.md
